name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The USBTMC framing, the SCPI encoder and the waveform maths are all pure
      # functions, so the whole instrument language is tested here with no
      # oscilloscope attached.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
