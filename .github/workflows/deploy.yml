name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - uses: actions/configure-pages@v6
        id: pages

      # vite.config.ts defaults `base` to the repo path, which is what a project
      # site needs. configure-pages reports the real base_path, so honour it and
      # the site keeps working even if the repo is renamed. If that output is
      # missing or empty the config keeps its own default rather than building
      # for the domain root, which would 404 every asset.
      - name: Build
        run: npx vite build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
